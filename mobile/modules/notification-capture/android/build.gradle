plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.aniketsharma.expensetracker'
version = '1.0.0'

android {
  namespace "expo.modules.notificationcapture"
  // expo-module-gradle-plugin publishes a release component and fails
  // configuration without these — every shipped Expo module declares them.
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Background upload of captures (CaptureUploadWorker): runs when there's a
  // network, retries with backoff, survives the app being killed.
  implementation "androidx.work:work-runtime:2.10.0"
}
